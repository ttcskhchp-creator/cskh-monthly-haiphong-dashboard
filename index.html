<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" href="data:,">
    <title>Magic Story Reader by Daddy Dũng</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tesseract.js -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
    <!-- PDF.js & Mammoth -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
    const HUES = ['pink','blue','indigo','purple','orange', 'teal'];
    const T = (id,icon,name,dark,bg,card,ink,...c) => ({id,icon,name,dark,bg,card,ink,c});
    const THEMES = [
        T('candy','🍬','Kẹo Hồng',0,'#fdf2f8','#ffffff','#1e293b','#ec4899','#3b82f6','#6366f1','#a855f7','#f97316','#0d9488'),
        T('ocean','🌊','Đại Dương',0,'#e8f6ff','#ffffff','#0f2a3d','#0891b2','#2563eb','#4f46e5','#0d9488','#0284c7','#0f766e'),
        T('forest','🌿','Rừng Xanh',0,'#eef8ea','#ffffff','#1b2e1f','#16a34a','#0f766e','#4d7c0f','#a16207','#c2410c','#059669')
    ];
    function applyTheme(id) {
        const t = THEMES.find(x => x.id === id) || THEMES[0], s = document.documentElement.style;
        s.setProperty('--bg', t.bg); s.setProperty('--card', t.card); s.setProperty('--ink', t.ink);
        HUES.forEach((h, i) => s.setProperty('--' + h, t.c[i]));
        s.colorScheme = t.dark ? 'dark' : 'light';
        document.documentElement.dataset.theme = t.id;
        try { localStorage.setItem('magicTheme', t.id); } catch (e) {}
    }
    (() => {
        const sh = [50,100,200,300,400,500,600,700]; let css = ':root{';
        HUES.forEach(h => {
            [[50,8],[100,16],[200,28],[300,45],[400,75]].forEach(([n,p]) => css += `--${h}-${n}:color-mix(in srgb,var(--${h}) ${p}%,var(--card));`);
            css += `--${h}-500:var(--${h});--${h}-600:color-mix(in srgb,var(--${h}) 82%,var(--ink));--${h}-700:color-mix(in srgb,var(--${h}) 60%,var(--ink));`;
        });
        [[50,5],[100,9],[200,16],[300,28],[400,45],[500,62],[600,75],[700,85]].forEach(([n,p]) => css += `--slate-${n}:color-mix(in srgb,var(--ink) ${p}%,var(--card));`);
        const st = document.createElement('style'); st.textContent = css + '}'; document.head.appendChild(st);
        tailwind.config = { theme: { extend: { colors: { card: 'var(--card)', ...Object.fromEntries([...HUES, 'slate'].map(h => [h, Object.fromEntries(sh.map(n => [n, `var(--${h}-${n})`]))])) } } } };
        let saved; try { saved = localStorage.getItem('magicTheme'); } catch (e) {} applyTheme(saved);
    })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        body { font-family: 'Nunito', sans-serif; color: var(--ink); background-color: var(--bg); background-image: radial-gradient(var(--pink-200) 2px, transparent 2px); background-size: 30px 30px; display: flex; flex-direction: column; min-height: 100vh; }
        .btn-bounce { transition: transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.1s; }
        .btn-bounce:active { transform: scale(0.95); }
        .spinner { border: 4px solid var(--pink-100); border-top-color: var(--pink-500); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .marquee-container { width: 100%; overflow: hidden; white-space: nowrap; background: var(--card); padding: 4px 0; border-top: 2px dashed var(--pink-200); border-bottom: 2px dashed var(--pink-200); margin-bottom: 0.5rem; }
        .marquee-text { display: inline-block; padding-left: 100%; animation: marquee 15s linear infinite; font-weight: 800; color: var(--pink-500); }
        @keyframes marquee { 0% { transform: translate(0, 0); } 100% { transform: translate(-100%, 0); } }
        .blur-active { filter: blur(8px); pointer-events: none; user-select: none; transition: filter 0.5s ease; }
        #storyText { white-space: pre-wrap; tab-size: 4; }
        #dropZone.drag { border-color: var(--pink-500); background: var(--pink-50); }
        .avatar-selected { border-color: var(--orange-500) !important; background-color: var(--orange-100) !important; transform: scale(1.1); }
    </style>
</head>
